<body>
<title>Mapas · Juan Carlos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: app de tela cheia — barra superior fina, quadro escuro com brilho azul, painéis laterais em panel. */
:root {
  --bg: #030B1A;
  --panel: #071429;
  --panel-2: #0C1D3D;
  --line: #1A2C52;
  --text: #EEF3FA;
  --muted: #9FB0CC;
  --blue: #0090F0;
  --blue-deep: #0054CC;
  --green: #00B874;
  --coral: #FF7A59;
  --font-d: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --font-b: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --accent-text: #0090F0;
  --on-blue: #030B1A;
  --hover: #10264f;
  --line-strong: #2B4475;
  --glass: rgba(7,20,41,.94);
  --glass-2: rgba(12,29,61,.92);
  --scrim: rgba(3,11,26,.72);
  --shadow: rgba(0,0,0,.45);
  --warn-text: #ffd2c6;
  --danger-text: #ffb4a3;
  color-scheme: dark;
}
:root[data-mapa="light"] {
  --bg: #F4F7FB;
  --panel: #FFFFFF;
  --panel-2: #EEF3FA;
  --line: #D3DCEA;
  --text: #030B1A;
  --muted: #4A5B78;
  --accent-text: #0054CC;
  --hover: #E3EBF7;
  --line-strong: #B7C6DD;
  --glass: rgba(255,255,255,.96);
  --glass-2: rgba(255,255,255,.94);
  --scrim: rgba(3,11,26,.45);
  --shadow: rgba(3,11,26,.16);
  --warn-text: #8A2E14;
  --danger-text: #B4381A;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.top {
  display: flex; align-items: center; gap: 12px; min-height: 56px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; text-decoration: none; color: var(--text); }
.brand svg { width: 30px; height: 30px; display: block; }
.brand-word { font-family: var(--font-d); font-weight: 800; font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; }
.brand-word b { color: var(--green); font-weight: 800; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-block: 4px; flex: none; }
.spacer { flex: 1; }

.overline {
  display: flex; align-items: center; gap: 8px; color: var(--accent-text);
  font-family: var(--font-b); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
}
.overline::before { content: ""; width: 20px; height: 2px; border-radius: 1px; background: var(--blue); flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--hover); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.primary:hover { background: #22a2ff; border-color: #22a2ff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); border-color: var(--line); }
.btn.icon { width: 36px; padding: 0; }
.btn.danger { color: var(--danger-text); }
.btn.danger:hover { border-color: var(--coral); background: rgba(255,122,89,.12); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
.seg button { height: 34px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; touch-action: none; display: block; }
.zoom {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 6px; z-index: 3;
}
.zoom .btn { background: var(--glass-2); }
.zoom-label { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

/* apresentação */
.show {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.show .stage { flex: 1; }
.show-top {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; z-index: 3; pointer-events: none;
}
.show-top > * { pointer-events: auto; }
.show-top .brand-word { font-size: 11px; }
.show-cap {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3;
  display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
}
.cap-card {
  flex: 1 1 360px; min-width: 0; max-width: 820px; background: var(--glass); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px 20px; display: grid; gap: 6px; backdrop-filter: blur(6px);
}
.cap-title { font-family: var(--font-d); font-weight: 800; font-size: clamp(18px, 2.4vw, 28px); letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.cap-note { color: var(--muted); font-size: 15px; line-height: 1.5; white-space: pre-wrap; max-height: 9em; overflow: auto; }
.cap-note:empty { display: none; }
.cap-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.cap-count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; min-width: 64px; text-align: center; }
.progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--line); z-index: 4; margin-top: env(safe-area-inset-top, 0px); }
.progress i { display: block; height: 100%; background: var(--green); width: 0; transition: width .4s; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 10px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100% - 32px);
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 640px) {
  .hide-sm { display: none !important; }
  .btn { padding: 0 10px; }
}

.theme-btn .sun { display: none; }
:root[data-mapa="light"] .theme-btn .sun { display: block; }
:root[data-mapa="light"] .theme-btn .moon { display: none; }

.lightbox {
  position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox figure { margin: 0; display: grid; gap: 10px; justify-items: center; max-width: 100%; max-height: 100%; }
.lightbox img { max-width: min(1200px, 100%); max-height: calc(100vh - 120px); border-radius: 12px; box-shadow: 0 24px 60px var(--shadow); background: var(--panel); }
.lightbox figcaption { color: var(--text); font-weight: 600; text-align: center; max-width: 60ch; }
.lightbox > .btn { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.gate {
  position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background-image: radial-gradient(900px 600px at 92% -10%, rgba(0,144,240,.18), transparent 70%);
}
.g-card { width: min(440px, 100%); display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 26px; box-shadow: 0 30px 70px var(--shadow); }
.g-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 800; font-size: 11.5px; letter-spacing: .06em; margin-bottom: 10px; }
.g-brand svg { width: 34px; height: 34px; }
.g-brand b { color: var(--green); }
.g-card h1 { margin: 0; font-family: var(--font-d); font-weight: 900; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; }
.g-p { margin: 0; color: var(--muted); line-height: 1.55; }
.g-form { display: grid; gap: 12px; margin-top: 4px; }
.g-form label { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.g-form input:not([type="checkbox"]) { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 15px; color: var(--text); }
.g-form input:focus { outline: none; border-color: var(--blue); }
.g-form .g-check { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text); font-size: 13.5px; }
.g-form .g-check input { width: 18px; height: 18px; accent-color: #0090F0; }
.g-form .btn { height: 46px; font-size: 15px; margin-top: 4px; }
.g-small { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.g-err { margin: 0; color: var(--danger-text); background: rgba(255,122,89,.1); border: 1px solid rgba(255,122,89,.4); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
.g-steps { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.g-steps summary { cursor: pointer; font-weight: 700; color: var(--text); font-size: 13.5px; }
.g-steps ol { margin: 10px 0 2px; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.g-steps b { color: var(--text); }
.g-steps a { color: var(--accent-text); font-weight: 600; word-break: break-all; }

.wordmark { font-family: var(--font-d); font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.field {
  height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 11px; min-width: 0;
}
.field:hover { border-color: var(--line-strong); }
.field:focus { outline: none; border-color: var(--blue); }
.top { flex-wrap: nowrap; gap: 10px; min-height: 52px; }
.titlebox { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
#title { font-family: var(--font-d); font-weight: 800; font-size: 15.5px; letter-spacing: -0.015em; flex: 0 1 auto; width: 32ch; min-width: 90px; max-width: 100%; height: 34px; padding: 0 8px; background: transparent; border-color: transparent; text-overflow: ellipsis; }
#title:hover, #title:focus { background: var(--bg); border-color: var(--line); }
#client { flex: none; width: 150px; height: 28px; border-radius: 999px; padding: 0 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); border-color: transparent; }
#client:hover, #client:focus { color: var(--text); border-color: var(--line); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; width: 118px; flex: none; overflow: hidden; text-overflow: ellipsis; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.status.pending::before { background: var(--line-strong); }
.status.err::before { background: var(--coral); }
.vsep { width: 1px; height: 22px; background: var(--line); flex: none; }
.btn.icon[aria-pressed="false"] { color: var(--muted); }
.panel-btn svg { width: 19px; height: 19px; }
.status.err { color: var(--danger-text); }
.group { display: flex; gap: 6px; align-items: center; }

.body { --lw: 264px; --rw: 300px; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); transition: grid-template-columns .2s ease; }
.body.left-off { --lw: 0px; }
.body.right-off { --rw: 0px; }
.body.left-off .side, .body.right-off .insp { visibility: hidden; border: 0; }
.side, .insp { background: var(--panel); min-height: 0; overflow: auto; min-width: 0; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.insp { border-left: 1px solid var(--line); }
.side-head { display: grid; gap: 10px; padding: 16px 14px 12px; position: sticky; top: 0; background: var(--panel); z-index: 1; border-bottom: 1px solid var(--line); }
.side-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font-family: var(--font-d); font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.list { padding: 8px 8px 24px; display: grid; gap: 14px; }
.grp { display: grid; gap: 2px; }
.grp .overline { padding: 6px 8px 4px; font-size: 10.5px; }
.item {
  display: grid; gap: 2px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; width: 100%;
}
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--panel-2); border-color: var(--line); box-shadow: inset 0 0 0 1px rgba(0,144,240,.35); }
.item b { font-weight: 600; font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list-empty { color: var(--muted); padding: 12px; line-height: 1.5; font-size: 13px; }

.insp-in { padding: 18px 16px 28px; display: grid; gap: 18px; }
.insp h3 { margin: 0; font-family: var(--font-d); font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
.f { display: grid; gap: 6px; }
.f label, .f .lab { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.f textarea, .f input { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 9px 11px; line-height: 1.45; resize: vertical; }
.f textarea:focus, .f input:focus { outline: none; border-color: var(--blue); }
.f small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.sw { display: flex; flex-wrap: wrap; gap: 7px; }
.sw button {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; background: var(--c);
}
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
.sw .auto { background: conic-gradient(#0090F0 0 25%, #00B874 0 50%, #5CC8FF 0 75%, #7C8CFF 0); }
.marks { display: flex; flex-wrap: wrap; gap: 6px; }
.marks button {
  height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
}
.marks button i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.marks button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--bg)); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts .btn { justify-content: flex-start; }
.kbd-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.kbd-list li { display: flex; justify-content: space-between; gap: 10px; }
kbd { font-family: var(--font-b); font-size: 11.5px; font-weight: 700; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.tip { font-size: 13px; line-height: 1.55; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; }
.tip b { color: var(--text); }

#ed {
  position: absolute; z-index: 4; resize: none; overflow: hidden; border: 2px solid var(--blue); border-radius: 8px;
  background: var(--panel-2); color: var(--text); padding: 0; margin: 0; outline: none; line-height: 1.35; transform-origin: 0 0;
}
.empty {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; z-index: 2;
}
.empty > div { max-width: 460px; display: grid; gap: 14px; justify-items: start; }
.empty h1 { margin: 0; font-family: var(--font-d); font-weight: 900; font-size: clamp(26px, 3vw, 34px); letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); line-height: 1.6; }
.banner {
  position: absolute; top: auto; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 32px);
  font-size: 13px; background: rgba(255,122,89,.14); border: 1px solid rgba(255,122,89,.5); color: var(--warn-text); padding: 8px 14px; border-radius: 10px;
}

/* menus e diálogos */
.menu {
  position: fixed; z-index: 60; min-width: 250px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px; display: grid; gap: 2px; box-shadow: 0 18px 40px var(--shadow);
}
.menu button {
  display: grid; gap: 1px; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 9px 11px;
}
.menu button:hover, .menu button:focus-visible { background: var(--line); outline: none; }
.menu button b { font-weight: 600; font-size: 14px; }
.menu button span { color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .danger b { color: var(--danger-text); }
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.dlg {
  width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px; display: grid; gap: 16px; box-shadow: 0 24px 60px var(--shadow);
}
.dlg h2 { margin: 0; font-family: var(--font-d); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; line-height: 1.15; }
.dlg p { margin: 0; color: var(--muted); line-height: 1.55; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tpl {
  text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; display: grid; gap: 3px;
}
.tpl b { font-weight: 700; font-size: 13.5px; }
.tpl span { font-size: 12px; color: var(--muted); line-height: 1.35; }

/* Mapas Juan Carlos — núcleo compartilhado (layout, desenho, link do cliente, apresentação) */
const JC = (() => {
  const FONT_D = '"Montserrat", "Segoe UI", system-ui, sans-serif';
  const FONT_B = '"Figtree", "Segoe UI", system-ui, sans-serif';

  const THEMES = {
    dark: {

  const COLORS = [
    { v: '#0090F0', n: 'Azul da marca' },
    { v: '#00B874', n: 'Verde da marca' },
    { v: '#E53935', n: 'Vermelho' },
    { v: '#FFC400', n: 'Amarelo' },
    { v: '#1E5BFF', n: 'Azul' },
    { v: '#FF7A00', n: 'Laranja' },
    { v: '#22A84A', n: 'Verde' },

    { v: '#FF4FA3', n: 'Rosa' },
    { v: '#19C7B4', n: 'Turquesa' },
    { v: '#5CC8FF', n: 'Céu' },
    { v: '#8D5B3B', n: 'Marrom' },
    { v: '#9FB0CC', n: 'Cinza' },
    { v: '#1C2333', n: 'Preto' },
    { v: '#FFFFFF', n: 'Branco' }
  ];
  const BRANCH = ['#0090F0', '#00B874', '#5CC8FF', '#7C8CFF', '#19C7B4', '#FF7A59'];
  function lum(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    return 0.2126 * f((n >> 16) & 255) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
  }
  function onColor(hex) { const L = lum(hex); return (L + 0.05) / 0.05 >= 1.05 / (L + 0.05) ? '#030B1A' : '#FFFFFF'; }
  function hsvToRgb(h, s, v) {
    const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
  }
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
    return [h, mx ? d / mx : 0, mx];
  }
  function rgbToHex(r, g, b) { return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, x | 0)).toString(16).padStart(2, '0')).join('').toUpperCase(); }
  function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  /* ---------- imagens (carregadas sob demanda) ---------- */
  const IMG = new Map();
  let imgResolver = id => '/_blob/' + id;
  const imgListeners = [];
  function setImageResolver(f) { imgResolver = f; IMG.clear(); }
  function onImageLoad(f) { imgListeners.push(f); }
  function getImg(id) {

(ctx.measureText(test).width <= maxW) line = test;\n        else { if (line) out.push(line); line = w; }\n      }\n      out.push(line);\n    }\n    return out.length ? out : [''];\n  }\n\n  const GAP_X = [70, 48, 40];\n  const MIN_W = 70, MAX_W = 900;\n  /* al\u00e7a de redimensionar: canto de baixo, no lado livre do t\u00f3pico */\n  function handlePos(it) {\n    const side = it.depth === 0 ? 1 : (it.dir < 0 ? -1 : 1);\n    return { x: it.cx + side * it.w / 2, y: it.cy + it.h / 2, side };\n  }\n  const GAP_Y = [26, 14, 10];\n\n  /* opts: { mode: 'both'|'right', ignoreCollapsed } */\n  function layout(root, opts = {}) {\n    const ctx = mctx();\n    const L = { nodes: new Map(), order: [], root: null };\n    function meas(n, depth, parent, idx) {\n      const st = styleFor(depth);\n      ctx.font = st.font;\n      const has = n.text && n.text.trim();\n      const text = has ? n.text : (depth === 0 ? 'Tema central' : 'Novo t\u00f3pico');\n      const extraL = n.mark ? 24 : 0;\n      const extraR = (n.note || n.link) ? 14 : 0;\n      const fixedW = n.width > 0 ? Math.max(MIN_W, Math.min(MAX_W, n.width)) : 0;\n      const lines = wrap(ctx, text, fixedW ? Math.max(30, fixedW - st.px * 2 - extraL - extraR) : st.maxW);\n      const tw = Math.max(depth ? 24 : 60, ...lines.map(l => ctx.measureText(l).width));\n      let color;\n      if (depth === 0) color = n.color || THEMES.dark.rootFill;\n      else if (depth === 1) color = n.color || BRANCH[idx % BRANCH.length];\n      else color = n.color || (parent.depth === 0 ? parent.kidsColor || BRANCH[0] : parent.color);\n      let im = null;\n      if (n.img && n.img.w > 0 && n.img.h > 0) {\n        const maxW = fixedW ? fixedW - st.px * 2 : depth === 0 ? 280 : depth === 1 ? 230 : 210;\n        const maxH = fixedW ? Math.max(200, maxW * 1.25) : 200;\n        let iw = Math.min(maxW, n.img.w), ih = iw * n.img.h / n.img.w;\n        if (ih > maxH) { ih = maxH; iw = ih * n.img.w / n.img.h; }\n        im = { iw: Math.round(iw), ih: Ma /* ---------- imagens ---------- */
function pickImage(nodeId) {
  if (!assets) { toast('Imagens funcionam ao abrir a ferramenta pelo claude.ai.'); return; }
  imgTarget = nodeId; $('file').value = ''; $('file').click();
}
$('file').onchange = () => { const f = $('file').files[0]; if (f && imgTarget) attachImage(imgTarget, f); };
async function prepImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = im.naturalWidth || 800, h = im.naturalHeight || 600;
    const k = Math.min(1, 1600 / Math.max(w, h));
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.86));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}
async function attachImage(nodeId, file) {
  if (!assets) { toast('Imagens funcionam ao abrir a ferramenta pelo claude.ai.'); return; }
  if (!file || !/^image\//.test(file.type)) { toast('Escolha um arquivo de imagem (JPG, PNG, WebP ou GIF).'); return; }
  toast('Enviando imagem…');
  try {
    const { blob, w, h } = await prepImage(file);
    const r = await assets.upload(blob, { type: blob.type });
    const f = JC.find(cur.root, nodeId); if (!f) return;
    mutate(() => { f.node.img = { id: r.id, w, h }; });
    select(nodeId);
    toast('Imagem adicionada');
  } catch (e) {
    const c = e && e.code;
    toast(c === 'too_large' ? 'Imagem grande demais. Use uma de até 20 MB.'
      : c === 'quota_or_state' ? 'O espaço de imagens acabou. Remova imagens que não usa mais.'
      : c === 'rate_limited' ? 'Muitas imagens seguidas. Espere alguns segundos.'
      : 'Não foi possível enviar a imagem. Tente de novo.');
  }
}
(() => {
  const st = $('stage');
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  st.addEventListener('dragover', e => { if (!cur || !hasFiles(e)) return; e.preventDefault(); st.classList.add('dropzone'); });
  st.addEventListener('dragleave', e => { if (e.target === st || !st.contains(e.relatedTarget)) st.classList.remove('dropzone'); });
  st.addEventListener('drop', e => {

    e.preventDefault();
    const file = [...e.dataTransfer.files].find(f => /^image\//.test(f.type));
    if (!file) { toast('Solte um arquivo de imagem'); return; }

/* ---------- seletor de cor (círculo cromático) ---------- */
const Picker = (() => {
  let el = null, done = null, outH = null, keyH = null;
  function close(apply) {
    if (!el) return;
    const d = done; done = null;
    el.remove(); el = null;
    document.removeEventListener('pointerdown', outH, true);
    document.removeEventListener('keydown', keyH, true);
    if (d) d(apply);
  }
  function open(anchor, start, onLive, onEnd) {
    close(false);
    let [r, g, b] = JC.hexToRgb(/^#[0-9A-F]{6}$/i.test(start) ? start : '#0090F0');
    let [h, s, v] = JC.rgbToHsv(r, g, b);
    if (v < 0.04) { v = 0.04; }
    let hex = JC.rgbToHex(r, g, b);
    el = document.createElement('div');
    el.className = 'cpick';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Cor personalizada');
    el.innerHTML = `
      <span class="overline">Cor personalizada</span>
      <div class="cp-wheel"><canvas width="440" height="440" aria-label="Círculo cromático: arraste para escolher o tom"></canvas><i class="cp-dot"></i></div>
      <div class="f"><label for="cp-v">Brilho</label><input class="cp-v" id="cp-v" type="range" min="0" max="100" step="1"></div>
      <div class="cp-row"><span class="cp-prev"></span>
        <div class="cp-fields">
          <label>HEX<input id="cp-hex" maxlength="7" spellcheck="false" autocomplete="off"></label>
          <label>R<input id="cp-r" type="number" min="0" max="255" inputmode="numeric"></label>
          <label>G<input id="cp-g" type="number" min="0" max="255" inputmode="numeric"></label>
          <label>B<input id="cp-b" type="number" min="0" max="255" inputmode="numeric"></label>
        </div></div>
      <div class="foot"><button class="btn ghost" type="button" id="cp-cancel">Cancelar</button><button class="btn primary" type="button" id="cp-ok">Usar esta cor</button></div>`;
    document.body.appendChild(el);
    const q = sel => el.querySelector(sel);
    const cv = q('canvas'), cx = cv.getContext('2d'), dot = q('.cp-dot'), vr = q('#cp-v');
    function paint() {
      const W = 440, R = 220, img = cx.createImageData(W, W), d = img.data;
      for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
        const dx = x - R + 0.5, dy = y - R + 0.5, dist = Math.hypot(dx, dy);
        if (dist > R) continue;
        const hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        const [rr, gg, bb] = JC.hsvToRgb(hue, Math.min(1, dist / R), v);
        const i = (y * W + x) * 4;

    });

    el.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); close(true); } e.stopPropagation(); }));

function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(save, 700); setStatus('pending'); }

}
function setStatus(state) {

  const put = (txt, cls, tip) => { s.innerHTML = '<span></span>'; s.firstChild.textContent = txt; s.className = 'status' + (cls ? ' ' + cls : ''); s.title = tip || txt; };
  if (!cur) { s.innerHTML = ''; s.className = 'status'; s.style.visibility = 'hidden'; return; }
  s.style.visibility = '';

  if (state === 'pending' || saving || dirty) return put('Salvando…', 'pending');

function onRemote(docs) {
  const next = new Map();
  for (const d of docs) { const v = d.data(); if (v && v.root) next.set(d.id, v); }
  // mantém o que ainda não foi confirmado localmente
  if (cur && (dirty || saving)) next.set(cur.id, JC.clone(plain(cur)));
  maps = next;
  if (cur) {
    const r = maps.get(cur.id);
    if (!r) { cur = null; }
    else if (!dirty && !saving && !editing && (r.updatedAt || 0) > (cur.updatedAt || 0)) {
      cur = { id: cur.id, ...JC.clone(plain(r)) };
      if (sel && !JC.find(cur.root, sel)) sel = null;
      $('title').value = cur.title || ''; $('client').value = cur.client || '';
      setModeUI(); relayout(); renderInspector();
      if (view === 'list' && !$('outline').contains(document.activeElement)) renderOutline();
    }
  }
  firstSnap = false;
  if (!cur && maps.size) {
    let last = null; try { last = localStorage.getItem('mapas-jc-last'); } catch (e) {}
    const pick = (last && maps.has(last)) ? last : [...maps.entries()].sort((a, b) => b[1].updatedAt - a[1].updatedAt)[0][0];
    openMap(pick);
  }

  const links = (m.links || []).filter(l => ids.has(l.from) && ids.has(l.to)).map(l => Object.assign({}, l, { id: JC.uid(), from: ids.get(l.from), to: ids.get(l.to) }));

    { t: 'Montar slides da apresentação', disabled: !cur, do: () => { inspTab = 'slides'; Panels.showRight(); renderInspector(); } },
    '-',
    { t: (cur && cur.mode !== 'right' ? '✓ ' : '') + 'Ramos dos dois lados', disabled: !cur, do: () => setLayoutMode('both') },
    { t: (cur && cur.mode === 'right' ? '✓ ' : '') + 'Todos os ramos à direita', disabled: !cur, do: () => setLayoutMode('right') },
    { t: 'Abrir todos os ramos', disabled: !cur, do: () => mutate(() => JC.walk(cur.root, n => { delete n.collapsed; })) },
    '-',
    { t: 'Apagar este mapa', danger: true, disabled: !cur, do: () => confirmDelete() },
    ...(window.Web ? ['-', { t: 'Trocar senha', do: () => window.Web.changePasswordDialog() }, { t: 'Sair', s: 'Pede usuário e senha de novo', do: () => window.Web.logout() }] : [])
  ]);
};

/* ---------- diálogos ---------- */
function dialog(html, onMount) {
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(s);
  const close = () => { s.remove(); document.removeEventListener('keydown', k, true); board.c.focus({ preventScroll: true }); };
  const k = e => { if (e.key === 'Escape') { e.preventDefault(); close(); } e.stopPropagation(); };
  document.addEventListener('keydown', k, true);
  s.addEventListener('pointerdown', e => { if (e.target === s) close(); });
  onMount(s, close);
  return close;
}

function parseOutline(text) {
  const rows = [];
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    if (!raw.trim()) continue;
    const ind = raw.match(/^[\t ]*/)[0].replace(/\t/g, '    ').length;
    let t = raw.trim(), lvl;
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { lvl = h[1].length - 1; t = h[2]; rows.push({ h: true, lvl, t }); continue; }
    t = t.replace(/^([-*+•◦▪–]|\d+[.)])\s+/, '');
    rows.push({ h: false, ind, t });
  }
  if (!rows.length) return [];
  const maxH = rows.filter(r => r.h).reduce((m, r) => Math.max(m, r.lvl), -1);
  const inds = [...new Set(rows.filter(r => !r.h).map(r => r.ind))].sort((a, b) => a - b);
  rows.forEach(r => { if (!r.h) r.lvl = maxH + 1 + inds.indexOf(r.ind); });
  const top = []; const stack = [];
  for (const r of rows) {
    const n = N(r.t.trim());
    while (stack.length && stack[stack.length - 1].lvl >= r.lvl) stack.pop();
    if (stack.length) stack[stack.length - 1].n.children.push(n); else top.push(n);
    stack.push({ lvl: r.lvl, n });
  }
  return top;
}

    <div class="foot"><button class="btn ghost" type="button" id="im-no">Cancelar</button><button class="btn primary" type="button" id="im-ok">Criar mapa</button></div>

/* ---------- link do cliente (GitHub Pages, mapa criptografado) ---------- */
function clientUrl(pub) { return PAGES_URL + '#' + pub.id + '.' + pub.key; }
function mcpErrorText(e) {
  const c = e && e.code;
  if (c === 'server_not_connected' || c === 'server_not_found') return 'O GitHub não está conectado. Conecte em claude.ai → Configurações → Conectores e tente de novo.';
  if (c === 'needs_reauth') return 'A conexão com o GitHub expirou. Reconecte em claude.ai → Configurações → Conectores.';
  if (c === 'not_in_manifest') return 'Esta página não tem permissão para usar o GitHub. Recarregue a página e permita o acesso quando for pedido.';
  if (c === 'selection_required') return 'Você tem mais de uma conta do GitHub conectada. Escolha qual usar no aviso do claude.ai e tente de novo.';
  if (c === 'server_unavailable' || c === 'upstream_error') return 'O GitHub não respondeu agora. Espere alguns segundos e tente de novo.';
  if (c === 'blocked_by_policy' || c === 'approval_required') return 'A sua organização bloqueou esta ação do GitHub para esta página.';
  if (c === 'image_fetch') return 'Não consegui ler uma das imagens do mapa. Atualize a página e tente de novo.';
  if (c === 'tool_error') return 'O GitHub recusou a publicação: ' + (e.message || 'erro sem detalhe') + '.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'A publicação não funciona nesta visualização. Abra a ferramenta pelo claude.ai.';
  return 'Não foi possível publicar (' + (c || 'erro') + '). Tente de novo.';
}
async function publishClient() {
  if (!cur || !mcp || publishing) return;
  publishing = true;
  const id = cur.id;
  try {
    if (!cur.pub) { cur.pub = { id: JC.newId(), key: JC.newKey() }; dirty = true; }
    const snap = { title: cur.title, client: cur.client, mode: cur.mode, root: JC.clone(cur.root), links: JC.clone(cur.links || []), slides: JC.clone(cur.slides || []) };
    const pubId = cur.pub.id, key = cur.pub.key;
    const done = new Set(cur.pub.imgs || []);
    const todo = [...new Set(JC.imageIds(snap.root))].filter(x => !done.has(x));
    for (let i = 0; i < todo.length; i += 4) {
      const batch = todo.slice(i, i + 4), imgFiles = [];
      for (const imgId of batch) {
        imgFiles.push({ path: 'm/' + pubId + '/' + imgId + '.txt', content: await JC.sealRaw(await IMGIO.bytes(imgId), key) });
      }
      await mcp.callTool(GH.server, 'push_files', { owner: GH.owner, repo: GH.repo, branch: GH.branch, message: 'Imagens do mapa ' + pubId, files: imgFiles }, { cache: false });
      batch.forEach(x => done.add(x));
      if (cur && cur.id === id) { cur.pub = Object.assign({}, cur.pub, { imgs: [...done] }); dirty = true; }
    }
    const content = await JC.sealMap(snap, key);
    const files = [{ path: 'm/' + cur.pub.id + '.json', content }];
    let siteVer = null;
    try { const d = db ? await db.doc('config/site').get() : null; siteVer = d && d.exists ? d.data().ver : null; } catch (e) {}
    const withSite = siteVer !== CLIENT_VER;
    if (withSite) files.push(...SITE_FILES);
    await mcp.callTool(GH.server, 'push_files', {
      owner: GH.owner, repo: GH.repo, branch: GH.branch,
      message: 'Atualiza mapa ' + cur.pub.id + (withSite ? ' e a página do cliente' : ''),
      files
    }, { cache: false });
    if (withSite && db) { try { await db.doc('config/site').set({ ver: CLIENT_VER, at: Date.now() }); } catch (e) {} }
    if (cur && cur.id === id) {
      cur.pub = Object.assign({}, cur.pub, { at: Date.now(), rev: cur.updatedAt, imgs: [...done] });
      dirty = true; await save();
    }
    publishing = false;
    return { ok: true };
  } catch (e) {
    publishing = false;
    if (cur && cur.id === id) { dirty = true; save(); }
    return { ok: false, msg: mcpErrorText(e) };
  }
}
async function unpublish(pub) {
  if (!pub || !mcp) return;
  try { await mcp.callTool(GH.server, 'delete_file', { owner: GH.owner, repo: GH.repo, branch: GH.branch, path: 'm/' + pub.id + '.json', message: 'Remove mapa ' + pub.id }, { cache: false }); } catch (e) {}
}
$('b-share').onclick = () => {
  if (!cur) return;
  if (editing) commitEdit();
  flushSave();
  dialog('<div id="sh-body" style="display:grid;gap:16px"></div>', (s, close) => {
    const body = s.querySelector('#sh-body');
    let note = '';
    const draw = () => {
      const pub = cur && cur.pub && cur.pub.at ? cur.pub : null;
      const stale = pub && (cur.updatedAt || 0) > (pub.rev || 0) + 500;
      const link = pub ? clientUrl(pub) : '';
      body.innerHTML = `
        <span class="overline">Link do cliente</span>
        <h2>${esc(cur.title || 'Mapa')}</h2>
        <p>O cliente abre no celular ou no computador, sem login. Ele navega pelo mapa, lê as notas e pode apresentar em tela cheia, mas não edita. O mapa fica guardado criptografado no seu GitHub e só abre com este link.</p>
        ${!mcp ? `<div class="warn">Para publicar, abra a ferramenta pelo claude.ai com o conector do GitHub ligado.</div>` : ''}
        ${pub ? `<div class="linkbox"><input class="field" id="s-link" readonly value="${esc(link)}" aria-label="Link do cliente" style="flex:1 1 260px">
          <button class="btn primary" type="button" id="s-copy">Copiar link</button></div>
          <p style="font-size:13px">Versão do cliente publicada ${shortDate(pub.at)}. O link é sempre o mesmo: quando você atualiza, o cliente vê a versão nova no mesmo endereço.</p>` : ''}
        ${stale ? `<div class="warn">Você mudou o mapa depois da última publicação. Atualize para o cliente ver a versão nova.</div>` : ''}
        ${note}
        <div class="foot">
          ${pub ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Ver como o cliente</a>` : ''}
          <button class="btn ghost" type="button" id="s-close">Fechar</button>
          ${mcp ? `<button class="btn ${pub && !stale ? '' : 'primary'}" type="button" id="s-pub">${publishing ? 'Publicando…' : pub ? 'Atualizar versão do cliente' : 'Publicar e gerar link'}</button>` : ''}
        </div>`;
      s.querySelector('#s-close').onclick = close;
      const inp = s.querySelector('#s-link');
      if (inp) {
        inp.onfocus = () => inp.select();
        s.querySelector('#s-copy').onclick = () => {
          const fb = () => { inp.focus(); inp.select(); toast('Selecionei o link. Use Ctrl + C para copiar.'); };
          try { navigator.clipboard.writeText(link).then(() => toast('Link copiado. Cole no WhatsApp do cliente.'), fb); } catch (e) { fb(); }
        };
      }
      const pb = s.querySelector('#s-pub');
      if (pb) {
        pb.disabled = publishing;
        pb.onclick = async () => {
          pb.disabled = true; pb.textContent = 'Publicando…';
          const r = await publishClient();
          note = r.ok ? '<div class="okbox">Publicado. O GitHub leva cerca de 1 minuto para mostrar a versão nova no link.</div>' : `<div class="warn">${esc(r.msg)}</div>`;
          if (document.body.contains(body)) draw();
        };
      }
    };
    draw();
  });
};

/* ---------- exportar ---------- */
async function exportImg(kind, theme) {
  if (!cur || !dl) return;
  if (editing) commitEdit();
  await JC.fontsReady();
  if (JC.imageIds(cur.root).length) { toast('Preparando as imagens…'); await JC.preloadImages(cur.root); }
  const canvas = JC.renderImage(cur.root, { mode: cur.mode, theme, title: cur.title, client: cur.client, scale: 2, links: JC.cleanLinks(cur.links, cur.root) });
  const base = fileBase(cur);
  let data, name;
  if (kind === 'png') {
    data = await new Promise(r => canvas.toBlob(r, 'image/png'));
    name = base + '.png';
  } else {
    if (!window.jspdf) { toast('O gerador de PDF não carregou. Atualize a página e tente de novo.'); return; }
    const w = canvas.cssW * 0.75, h = canvas.cssH * 0.75;
    const pdf = new window.jspdf.jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'pt', format: [w, h], compress: true });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.setProperties({ title: cur.title || 'Mapa', author: 'Juan Carlos · Gestor de Performance' });
    data = new Blob([pdf.output('arraybuffer')]);
    name = base + '.pdf';
  }
  try { await dl.save({ filename: name, data }); toast('Arquivo pronto: ' + name); }
  catch (e) {
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited') { toast('Já tem um download esperando confirmação.'); return; }
    toast('Não foi possível baixar aqui. Tente pelo claude.ai no navegador.');
  }
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  if (Show.isOpen() || document.querySelector('.scrim') || Lightbox.isOpen() || Picker.isOpen()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (!cur) return;
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key;
  if (linkFrom && k === 'Escape') { cancelLink(); return; }
  if (selLink && (k === 'Delete' || k === 'Backspace')) { e.preventDefault(); removeLink(selLink); return; }
  if (selLink && k === 'Escape') { selLink = null; board.selLink = null; board.draw(); renderInspector(); return; }
  if (view === 'list' && !mod) return;
  if (!mod && !e.altKey && (k === 'l' || k === 'L') && sel) { e.preventDefault(); startLink(); return; }
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); doRedo(); return; }
  if (mod && k === '0') { e.preventDefault(); board.fitAll(); return; }
  if (mod && k === '[') { e.preventDefault(); Panels.toggleLeft(); return; }
  if (mod && k === ']') { e.preventDefault(); Panels.toggleRight(); return; }
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); board.zoomAt(1.2); return; }
  if (mod && k === '-') { e.preventDefault(); board.zoomAt(1 / 1.2); return; }
  if (mod && (k === 'c' || k === 'x') && sel) {
    const f = selNode(); if (!f) return;
    e.preventDefault();
    clip = JC.clone(f.node);
    try { navigator.clipboard.writeText(toOutline(f.node)).catch(() => {}); } catch (err) {}
    if (k === 'x' && f.parent) removeSel();
    toast(k === 'x' ? 'Ramo recortado' : 'Ramo copiado');
    return;
  }
  if (k === 'Tab') { e.preventDefault(); addChild(); return; }
  if (k === 'Enter') { e.preventDefault(); if (e.shiftKey && sel) startEdit(sel); else addSibling(); return; }
  if (k === 'F2') { e.preventDefault(); if (sel) startEdit(sel); return; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removeSel(); return; }
  if (k === ' ') { e.preventDefault(); if (sel) toggle(sel); return; }
  if (k === 'Escape') { select(null); return; }
  if (k.startsWith('Arrow')) {
    e.preventDefault();
    if (e.altKey && (k === 'ArrowUp' || k === 'ArrowDown')) { reorder(k === 'ArrowUp' ? -1 : 1); return; }
    nav(k.slice(5).toLowerCase());
    return;
  }
  if (!mod && !e.altKey && k.length === 1 && sel) { e.preventDefault(); startEdit(sel, { replace: k }); }
});
function toOutline(n, d = 0) { return '\t'.repeat(d) + (n.text || '') + '\n' + (n.children || []).map(c => toOutline(c, d + 1)).join(''); }
document.addEventListener('paste', e => {
  if (Show.isOpen() || document.querySelector('.scrim')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (!cur) return;
  const imgFile = e.clipboardData && [...(e.clipboardData.files || [])].find(f => /^image\//.test(f.type));
  if (imgFile) { e.preventDefault(); attachImage(sel || cur.root.id, imgFile); return; }
  const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
  const host = selNode() || { node: cur.root };
  let add = [];
  if (clip && text.replace(/\s+$/, '') === toOutline(clip).replace(/\s+$/, '')) add = [JC.freshIds(JC.clone(clip))];
  else if (text.trim()) add = parseOutline(text);
  else if (clip) add = [JC.freshIds(JC.clone(clip))];
  if (!add.length) return;
  e.preventDefault();
  mutate(() => { host.node.children = host.node.children || []; host.node.children.push(...add); host.node.collapsed = false; });
  select(add[0].id);
  toast(add.length > 1 ? `${add.length} tópicos colados` : 'Colado');
});

/* ---------- início ---------- */
Theme.button('b-theme');
setView(view);
Theme.on(t => { board.theme = t; board.draw(); });
async function boot() {
  await JC.fontsReady();
  updUndo();
  renderInspector();
  try { dl = await claude.use('downloads'); } catch (e) { dl = null; }
  try { db = await claude.use('db'); } catch (e) { db = null; }
  claude.use('assets').then(a => { assets = a; renderInspector(); }, () => { assets = null; });
  claude.use('mcp').then(m => { mcp = m; }, () => { mcp = null; });
  if (!db) {
    localMode = true;
    $('banner').textContent = 'Esta prévia não salva no servidor. Abra a ferramenta pelo claude.ai para guardar seus mapas.';
    $('banner').hidden = false;
    let saved = null; try { saved = JSON.parse(localStorage.getItem('mapas-jc-local') || 'null'); } catch (e) {}
    const now = Date.now();
    const ex = saved && saved.length ? saved : [['exemplo', { title: 'Exemplo · Estrutura de campanha', client: 'Geral', mode: 'both', root: TEMPLATES[1].make('Estrutura de campanha'), createdAt: now, updatedAt: now }]];
    onRemote(ex.map(([id, v]) => ({ id, data: () => v })));
    return;
  }
  db.collection('maps').onSnapshot(snap => {
    if (firstSnap && snap.empty && snap.metadata && snap.metadata.fromCache) return;
    onRemote(snap.docs);
  }, err => {
    lastErr = err; setStatus();
    toast('Perdi a conexão com o servidor. Atualize a página.');
  });
}
if (window.WEB_GATE) window.WEB_GATE.then(boot);
else if (window.claude && claude.use) boot();
else { window.claude = { use: async () => null }; boot(); }
})();
